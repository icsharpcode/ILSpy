name: Build XPlat Frontends

on:
  push:
    branches: '**'
  pull_request:
    branches: [ master, release/** ]

permissions:
  contents: read

jobs:
  # Skip push builds for branches whose open PR (base master/release/*) already builds
  # them via the pull_request trigger. Pushes to master/release/* always build.
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prs=0
        case "$GITHUB_EVENT_NAME/$GITHUB_REF_NAME" in
          push/master|push/release/*) ;;
          push/*) prs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open \
            -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" \
            --jq 'map(select(.base.ref == "master" or (.base.ref | startswith("release/")))) | length') ;;
        esac
        echo "run=$([ "$prs" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Install dependencies
      run: dotnet restore ILSpy.XPlat.slnf -p:RestoreEnablePackagePruning=false

    - name: Build Debug
      run: dotnet msbuild ILSpy.XPlat.slnf -p:Configuration=Debug -bl:Debug.binlog

    - name: Build Release
      run: dotnet msbuild ILSpy.XPlat.slnf -p:Configuration=Release -bl:Release.binlog

    - name: list files
      if: always()
      run: ls -la

    - name: print VERSION
      if: always()
      run: cat VERSION

    - name: Upload binlog
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: binlog
        path: '**/*.binlog'
        if-no-files-found: error
